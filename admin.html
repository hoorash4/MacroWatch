<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MacroWatch 관리자</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-slate-950 p-4 font-sans text-slate-100 sm:p-6">
  <main class="mx-auto max-w-3xl">
    <header class="mb-6 flex items-center justify-between rounded-xl border border-slate-700/80 bg-slate-900 p-5 shadow-xl">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight text-white">MacroWatch 관리자</h1>
        <p class="mt-1 text-xs text-slate-400">백업과 백엔드 작업 상태를 관리합니다.</p>
      </div>
      <a href="./" class="rounded-lg border border-slate-700 px-3 py-2 text-sm font-semibold text-slate-300 transition hover:border-blue-500 hover:text-white">
        <i class="fa-solid fa-arrow-left mr-1"></i> 대시보드
      </a>
    </header>

    <section class="rounded-2xl border border-slate-800 bg-slate-900 p-5 shadow-xl">
      <div class="mb-5 flex items-start justify-between gap-4">
        <div>
          <h2 class="text-lg font-bold text-white"><i class="fa-brands fa-google-drive mr-2 text-blue-400"></i>데이터베이스 백업</h2>
          <p class="mt-1 text-sm leading-relaxed text-slate-400">매주 일요일 오전 3시에 암호화된 최신 백업으로 Google Drive 파일을 갱신합니다.</p>
        </div>
        <span id="backup-badge" class="shrink-0 rounded-full border border-slate-700 bg-slate-800 px-3 py-1 text-xs font-semibold text-slate-400">확인 중</span>
      </div>

      <dl class="mb-5 grid grid-cols-1 gap-3 rounded-xl border border-slate-800 bg-slate-950/60 p-4 text-sm sm:grid-cols-2">
        <div>
          <dt class="text-xs text-slate-500">최근 실행</dt>
          <dd id="backup-time" class="mt-1 font-semibold text-slate-200">불러오는 중...</dd>
        </div>
        <div>
          <dt class="text-xs text-slate-500">실행 결과</dt>
          <dd id="backup-result" class="mt-1 font-semibold text-slate-200">불러오는 중...</dd>
        </div>
      </dl>

      <a href="https://github.com/hoorash4/macrowatch/actions/workflows/backup-database.yml"
         target="_blank" rel="noopener noreferrer"
         class="flex w-full items-center justify-center rounded-lg bg-blue-600 py-3 text-sm font-bold text-white shadow-lg shadow-blue-600/20 transition hover:bg-blue-500">
        <i class="fa-solid fa-database mr-2"></i> 지금 수동 백업
      </a>
      <p class="mt-3 text-center text-xs text-slate-500">GitHub에서 로그인 상태를 확인한 후 Run workflow 버튼을 누르면 됩니다.</p>
    </section>
  </main>

  <script>
    const workflowRunsUrl = 'https://api.github.com/repos/hoorash4/macrowatch/actions/workflows/backup-database.yml/runs?per_page=1';

    function displayTime(value) {
      if (!value) return '실행 기록 없음';
      return new Intl.DateTimeFormat('ko-KR', {
        dateStyle: 'medium',
        timeStyle: 'short',
        timeZone: 'Asia/Seoul'
      }).format(new Date(value));
    }

    async function loadBackupStatus() {
      const badge = document.getElementById('backup-badge');
      const time = document.getElementById('backup-time');
      const result = document.getElementById('backup-result');
      try {
        const response = await fetch(workflowRunsUrl, { headers: { Accept: 'application/vnd.github+json' } });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const run = (await response.json()).workflow_runs?.[0];
        if (!run) {
          badge.textContent = '기록 없음';
          time.textContent = '실행 기록 없음';
          result.textContent = '아직 백업이 실행되지 않았습니다.';
          return;
        }

        time.textContent = displayTime(run.updated_at || run.created_at);
        const states = {
          success: ['성공', 'border-emerald-700/50 bg-emerald-950/60 text-emerald-400'],
          failure: ['실패', 'border-red-700/50 bg-red-950/60 text-red-400'],
          cancelled: ['취소됨', 'border-amber-700/50 bg-amber-950/60 text-amber-400']
        };
        const [label, classes] = run.status === 'completed'
          ? (states[run.conclusion] || [run.conclusion || '완료', 'border-slate-700 bg-slate-800 text-slate-300'])
          : ['실행 중', 'border-blue-700/50 bg-blue-950/60 text-blue-400'];
        badge.className = `shrink-0 rounded-full border px-3 py-1 text-xs font-semibold ${classes}`;
        badge.textContent = label;
        result.textContent = label;
      } catch (error) {
        badge.textContent = '확인 실패';
        badge.className = 'shrink-0 rounded-full border border-amber-700/50 bg-amber-950/60 px-3 py-1 text-xs font-semibold text-amber-400';
        time.textContent = '상태를 불러오지 못했습니다.';
        result.textContent = error.message;
      }
    }

    loadBackupStatus();
  </script>
</body>
</html>
