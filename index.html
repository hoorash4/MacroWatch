<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웹 데이터 모니터링 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <div class="max-w-5xl mx-auto px-4 py-8">
    
    <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-5">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
          <i class="fa-solid fa-chart-line mr-2"></i>웹 데이터 추적 대시보드
        </h1>
        <p class="text-slate-400 text-sm mt-1">추적할 웹사이트와 수치의 CSS Selector를 관리합니다.</p>
      </div>
      <button onclick="fetchTargets()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm px-4 py-2 rounded-lg border border-slate-700 transition">
        <i class="fa-solid fa-rotate mr-1.5"></i>새로고침
      </button>
    </header>

    <div id="config-banner" class="bg-amber-500/10 border border-amber-500/30 rounded-xl p-5 mb-8 transition-all">
      <div class="flex justify-between items-center mb-2">
        <h3 class="font-semibold text-amber-400 flex items-center">
          <i class="fa-solid fa-key mr-2"></i>Supabase 연동 정보 설정
        </h3>
        <span id="config-status" class="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700 font-medium">미연결</span>
      </div>
      <p class="text-xs text-slate-300 mb-3">Supabase 프로젝트의 <b>Project URL</b>과 <b>anon public Key</b>를 입력하고 연결 버튼을 눌러주세요.</p>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">Project URL</label>
          <input id="cfg-url" type="text" placeholder="https://xxx.supabase.co" class="w-full bg-slate-800 text-sm p-2.5 rounded-lg border border-slate-700 focus:outline-none focus:border-amber-500 disabled:opacity-50 disabled:cursor-not-allowed transition">
        </div>
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">anon public Key (SUPABASE_PUBLISHABLE_KEY)</label>
          <input id="cfg-key" type="password" placeholder="eyJhbGciOi..." class="w-full bg-slate-800 text-sm p-2.5 rounded-lg border border-slate-700 focus:outline-none focus:border-amber-500 disabled:opacity-50 disabled:cursor-not-allowed transition">
        </div>
      </div>

      <div class="flex justify-end gap-2">
        <button id="btn-save" onclick="saveConfig()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs px-5 py-2 rounded-lg font-medium transition shadow-lg shadow-amber-600/20">연결 및 저장</button>
        <button id="btn-edit" onclick="enableEdit()" class="hidden bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-4 py-2 rounded-lg border border-slate-600 transition">
          <i class="fa-solid fa-pen-to-square mr-1"></i>수정
        </button>
        <button id="btn-reset" onclick="resetConfig()" class="hidden bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 text-xs px-3 py-2 rounded-lg border border-rose-500/30 transition">
          초기화
        </button>
      </div>
    </div>

    <section class="bg-slate-800/80 rounded-2xl p-6 border border-slate-700/60 shadow-xl mb-8">
      <h2 class="text-lg font-semibold mb-4 text-blue-400 flex items-center">
        <i class="fa-solid fa-plus-circle mr-2"></i>새 추적 항목 등록
      </h2>

<!--입력 폼 부분-->
      
<form id="add-form" onsubmit="handleAddTarget(event)" class="space-y-4">
<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
  <div>
    <label class="block text-xs font-medium text-slate-400 mb-1">수집 방식</label>
    <select id="input-type" onchange="toggleTypeFields()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-200">
      <option value="SELECTOR">일반 웹 Scraping (CSS Selector)</option>
      <option value="FRED">FRED 경제지표 (Series ID)</option>
      <option value="API">기타 범용 API (REST JSON)</option>
    </select>
  </div>
  <div class="md:col-span-2">
    <label class="block text-xs font-medium text-slate-400 mb-1">항목 이름 (Title)</label>
    <input type="text" id="input-title" required placeholder="예: 미국 10년물 국채 금리" 
           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
  </div>
</div>

<div id="field-selector" class="space-y-4">
  <div>
    <label class="block text-xs font-medium text-slate-400 mb-1">웹사이트 URL</label>
    <input type="url" id="input-url" placeholder="https://finance.yahoo.com/quote/%5ETXN" 
           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
  </div>
  <div>
    <label class="block text-xs font-medium text-slate-400 mb-1">CSS Selector</label>
    <input type="text" id="input-selector" placeholder='예: [data-testid="qsp-price"]' 
           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm font-mono focus:ring-2 focus:ring-blue-500 focus:outline-none">
  </div>
</div>

<div id="field-fred" class="hidden space-y-4">
  <div>
    <label class="block text-xs font-medium text-slate-400 mb-1">FRED Series ID</label>
    <input type="text" id="input-fred-id" placeholder="예: DGS10 (미국 10년물 국채 금리), UNRATE (실업률)" 
           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm font-mono focus:ring-2 focus:ring-blue-500 focus:outline-none">
  </div>
</div>

<div id="field-api" class="hidden space-y-4">
  <div>
    <label class="block text-xs font-medium text-slate-400 mb-1">API Endpoint URL</label>
    <input type="url" id="input-api-url" placeholder="https://api.example.com/data" 
           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm font-mono focus:ring-2 focus:ring-blue-500 focus:outline-none">
  </div>
  <div>
    <label class="block text-xs font-medium text-slate-400 mb-1">JSON 데이터 경로 (JSON Path)</label>
    <input type="text" id="input-json-path" placeholder="예: data.price 또는 observations[0].value" 
           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm font-mono focus:ring-2 focus:ring-blue-500 focus:outline-none">
  </div>
</div>
</form>

<!--입력 폼 끝-->
      
    </section>

    <section>
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold text-slate-200">추적 중인 항목 목록</h2>
        <span id="target-count" class="text-xs bg-slate-800 text-slate-400 px-3 py-1 rounded-full border border-slate-700">총 0개</span>
      </div>

      <div id="loading" class="text-center py-12 text-slate-500 hidden">
        <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
        <p class="text-sm">데이터를 불러오는 중입니다...</p>
      </div>

      <div id="target-list" class="grid grid-cols-1 gap-4"></div>
    </section>

  </div>


  
  <script>
    let supabaseClient = null;

    window.addEventListener('DOMContentLoaded', () => {
      const savedUrl = localStorage.getItem('SP_URL') || '';
      const savedKey = localStorage.getItem('SP_KEY') || '';

      if (savedUrl) document.getElementById('cfg-url').value = savedUrl;
      if (savedKey) document.getElementById('cfg-key').value = savedKey;

      if (savedUrl && savedKey) {
        initSupabase(savedUrl, savedKey);
      }
    });

    function initSupabase(url, key) {
      try {
        supabaseClient = supabase.createClient(url, key);
        
        document.getElementById('config-status').textContent = '연결됨';
        document.getElementById('config-status').className = 'text-xs px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-medium';

        const banner = document.getElementById('config-banner');
        banner.className = 'bg-slate-800/50 border border-slate-700 rounded-xl p-5 mb-8 transition-all';

        setInputsDisabled(true);

        document.getElementById('btn-save').classList.add('hidden');
        document.getElementById('btn-edit').classList.remove('hidden');
        document.getElementById('btn-reset').classList.remove('hidden');

        fetchTargets();
      } catch (e) {
        alert('Supabase 클라이언트 생성 실패: ' + e.message);
      }
    }

    function setInputsDisabled(disabled) {
      document.getElementById('cfg-url').disabled = disabled;
      document.getElementById('cfg-key').disabled = disabled;
    }

    function enableEdit() {
      setInputsDisabled(false);

      const banner = document.getElementById('config-banner');
      banner.className = 'bg-amber-500/10 border border-amber-500/30 rounded-xl p-5 mb-8 transition-all';

      document.getElementById('config-status').textContent = '수정 중';
      document.getElementById('config-status').className = 'text-xs px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30 font-medium';

      document.getElementById('btn-save').classList.remove('hidden');
      document.getElementById('btn-edit').classList.add('hidden');
      document.getElementById('btn-reset').classList.remove('hidden');
    }

    function saveConfig() {
      const url = document.getElementById('cfg-url').value.trim();
      const key = document.getElementById('cfg-key').value.trim();

      if (!url || !key) return alert('URL과 Key를 모두 입력해 주세요.');

      localStorage.setItem('SP_URL', url);
      localStorage.setItem('SP_KEY', key);

      initSupabase(url, key);
    }

    function resetConfig() {
      if (!confirm('연결 설정을 초기화하시겠습니까?')) return;

      localStorage.removeItem('SP_URL');
      localStorage.removeItem('SP_KEY');
      
      document.getElementById('cfg-url').value = '';
      document.getElementById('cfg-key').value = '';
      
      setInputsDisabled(false);

      const banner = document.getElementById('config-banner');
      banner.className = 'bg-amber-500/10 border border-amber-500/30 rounded-xl p-5 mb-8 transition-all';

      document.getElementById('config-status').textContent = '미연결';
      document.getElementById('config-status').className = 'text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700 font-medium';

      document.getElementById('btn-save').classList.remove('hidden');
      document.getElementById('btn-edit').classList.add('hidden');
      document.getElementById('btn-reset').classList.add('hidden');

      supabaseClient = null;
      document.getElementById('target-list').innerHTML = '';
      document.getElementById('target-count').textContent = '총 0개';
    }

    async function fetchTargets() {
      if (!supabaseClient) return;

      const listEl = document.getElementById('target-list');
      const loadingEl = document.getElementById('loading');
      
      loadingEl.classList.remove('hidden');
      listEl.innerHTML = '';

      try {
        const { data, error } = await supabaseClient
          .from('targets')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;

        document.getElementById('target-count').textContent = `총 ${data.length}개`;

        if (data.length === 0) {
          listEl.innerHTML = `
            <div class="bg-slate-800/40 rounded-xl p-8 text-center text-slate-500 border border-slate-800">
              <i class="fa-regular fa-folder-open text-3xl mb-2"></i>
              <p class="text-sm">등록된 추적 항목이 없습니다. 위에서 새 항목을 추가해 보세요!</p>
            </div>
          `;
          return;
        }

        data.forEach(item => {
          listEl.appendChild(createTargetCard(item));
        });

      } catch (err) {
        alert('데이터 로드 실패: ' + err.message);
      } finally {
        loadingEl.classList.add('hidden');
      }
    }

    function createTargetCard(item) {
  // 1. 조건 종류(condition_type)에 따른 표시 텍스트 변환
  const condText = {
    'changed': '값 변경 시',
    'lte': `${item.target_value || ''} 이하일 때`,
    'gte': `${item.target_value || ''} 이상일 때`,
    'eq': `${item.target_value || ''} 일치 시`
  }[item.condition_type || 'changed'];

  // 2. 수집 방식 구분 (API vs Selector)
  const isApi = item.css_selector && item.css_selector.startswith ? item.css_selector.startswith('API:') : item.css_selector.startsWith('API:');
  const typeBadge = isApi 
    ? `<span class="text-[10px] bg-purple-950 text-purple-300 border border-purple-800 px-2 py-0.5 rounded-full font-mono">REST API</span>`
    : `<span class="text-[10px] bg-emerald-950 text-emerald-300 border border-emerald-800 px-2 py-0.5 rounded-full font-mono">WEB</span>`;

  // 3. 카드 HTML 생성
  return `
    <div class="bg-slate-800 border border-slate-700/80 rounded-xl p-4 shadow-sm hover:border-slate-600 transition space-y-3">
      <div class="flex items-start justify-between gap-2">
        <h3 class="font-bold text-slate-100 text-base leading-snug">${item.title}</h3>
        ${typeBadge}
      </div>

      <div class="bg-slate-900/60 rounded-lg p-3 border border-slate-700/40">
        <div class="text-[11px] text-slate-400 mb-0.5">최근 감지된 값</div>
        <div class="text-lg font-mono font-bold text-blue-400">
          ${item.last_value ? item.last_value : '<span class="text-xs text-slate-500 font-normal">아직 수집된 값 없음</span>'}
        </div>
      </div>

      <div class="flex items-center justify-between pt-1">
        <span class="text-xs bg-blue-950/80 text-blue-300 border border-blue-800/80 px-2.5 py-1 rounded-md flex items-center gap-1.5">
          <i class="fa-solid fa-bell text-[10px]"></i>
          <span>${condText}</span>
        </span>

        <button onclick="deleteTarget('${item.id}')" class="text-xs text-slate-400 hover:text-red-400 transition p-1">
          <i class="fa-regular fa-trash-can"></i> 삭제
        </button>
      </div>
    </div>
  `;
}


    
const FRED_API_KEY = "12ce2a29eb8e65de769bb88cc9deb4b0";

async function handleAddTarget(e) {
  e.preventDefault();
  if (!supabaseClient) return alert('먼저 Supabase 연동 정보를 입력하고 저장해 주세요.');

  const type = document.getElementById('input-type').value;
  const title = document.getElementById('input-title').value.trim();
  const condition_type = document.getElementById('input-condition').value;
  const target_value = document.getElementById('input-target-val').value.trim();

  let url = '';
  let css_selector = '';

  if (!title) return alert('항목 이름을 입력해 주세요.');

  // 1. FRED 선택 시
  if (type === 'FRED') {
    const seriesId = document.getElementById('input-fred-id').value.trim().toUpperCase();
    if (!seriesId) return alert('FRED Series ID를 입력해 주세요.');

    url = `https://api.stlouisfed.org/fred/series/observations?series_id=${seriesId}&api_key=${FRED_API_KEY}&file_type=json&sort_order=desc&limit=1`;
    css_selector = 'API:observations[0].value';

    // ✨ [FRED ID 실시간 유효성 검증]
    try {
      const checkRes = await fetch(url);
      const checkData = await checkRes.json();

      // FRED에서 에러 코드를 반환하거나 observations 배열이 비어있으면 저장 중단
      if (checkData.error_code || !checkData.observations || checkData.observations.length === 0) {
        return alert('존재하지 않거나 조회할 수 없는 FRED Series ID입니다. 확인 후 다시 입력해 주세요.');
      }
    } catch (err) {
      return alert('FRED ID 검증 중 오류가 발생했습니다: ' + err.message);
    }

  // 2. 범용 API 선택 시
  } else if (type === 'API') {
    url = document.getElementById('input-api-url').value.trim();
    const jsonPath = document.getElementById('input-json-path').value.trim();
    if (!url || !jsonPath) return alert('API URL과 JSON Path를 모두 입력해 주세요.');
    
    css_selector = `API:${jsonPath}`;

  // 3. 일반 웹 Scraping 선택 시
  } else {
    url = document.getElementById('input-url').value.trim();
    css_selector = document.getElementById('input-selector').value.trim();
    if (!url || !css_selector) return alert('URL과 CSS Selector를 모두 입력해 주세요.');
  }

  // 4. Supabase DB에 최종 저장
  try {
    const { error } = await supabaseClient
      .from('targets')
      .insert([{ 
        title, 
        url, 
        css_selector,
        condition_type,
        target_value
      }]);

    if (error) throw error;

    // 폼 초기화 및 목록 새로고침
    document.getElementById('add-form').reset();
    toggleTypeFields();
    fetchTargets();
    alert('추적 항목이 성공적으로 추가되었습니다!');

  } catch (err) {
    alert('추가 실패: ' + err.message);
  }
}

    

    async function toggleActive(id, currentStatus) {
      if (!supabaseClient) return;
      try {
        const { error } = await supabaseClient
          .from('targets')
          .update({ is_active: !currentStatus })
          .eq('id', id);

        if (error) throw error;
        fetchTargets();
      } catch (err) {
        alert('수정 실패: ' + err.message);
      }
    }

    async function deleteTarget(id) {
      if (!supabaseClient) return;
      if (!confirm('정말 이 항목을 삭제하시겠습니까?')) return;

      try {
        const { error } = await supabaseClient
          .from('targets')
          .delete()
          .eq('id', id);

        if (error) throw error;
        fetchTargets();
      } catch (err) {
        alert('삭제 실패: ' + err.message);
      }
    }

    function escapeHtml(str) {
      return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;") : '';
    }
    
   // 입력 필드 토글 함수
function toggleTypeFields() {
  const type = document.getElementById('input-type').value;
  
  const fieldSelector = document.getElementById('field-selector');
  const fieldFred = document.getElementById('field-fred');
  const fieldApi = document.getElementById('field-api');

  // 모두 숨기기
  fieldSelector.classList.add('hidden');
  fieldFred.classList.add('hidden');
  fieldApi.classList.add('hidden');

  // 선택된 항목만 보여주기
  if (type === 'FRED') {
    fieldFred.classList.remove('hidden');
  } else if (type === 'API') {
    fieldApi.classList.remove('hidden');
  } else {
    fieldSelector.classList.remove('hidden');
  }
}

// 항목 추가 처리 함수
const FRED_API_KEY = "YOUR_FRED_API_KEY";

async function handleAddTarget(e) {
  e.preventDefault();
  if (!supabaseClient) return alert('먼저 Supabase 연동 정보를 입력하고 저장해 주세요.');

  const type = document.getElementById('input-type').value;
  const title = document.getElementById('input-title').value.trim();
  const condition_type = document.getElementById('input-condition').value;
  const target_value = document.getElementById('input-target-val').value.trim();

  let url = '';
  let css_selector = '';

  if (type === 'FRED') {
    // 1. FRED 전용 처리
    const seriesId = document.getElementById('input-fred-id').value.trim().toUpperCase();
    if (!seriesId) return alert('FRED Series ID를 입력해 주세요.');

    url = `https://api.stlouisfed.org/fred/series/observations?series_id=${seriesId}&api_key=${FRED_API_KEY}&file_type=json&sort_order=desc&limit=1`;
    css_selector = 'API:observations[0].value';

  } else if (type === 'API') {
    // 2. 범용 API 처리
    url = document.getElementById('input-api-url').value.trim();
    const jsonPath = document.getElementById('input-json-path').value.trim();
    if (!url || !jsonPath) return alert('API URL과 JSON Path를 모두 입력해 주세요.');
    
    css_selector = `API:${jsonPath}`;

  } else {
    // 3. 일반 웹 Scraping 처리
    url = document.getElementById('input-url').value.trim();
    css_selector = document.getElementById('input-selector').value.trim();
    if (!url || !css_selector) return alert('URL과 CSS Selector를 모두 입력해 주세요.');
  }

  try {
    const { error } = await supabaseClient
      .from('targets')
      .insert([{ 
        title, 
        url, 
        css_selector,
        condition_type,
        target_value
      }]);

    if (error) throw error;

    document.getElementById('add-form').reset();
    toggleTypeFields();
    fetchTargets();
    alert('추적 항목이 성공적으로 추가되었습니다!');

  } catch (err) {
    alert('추가 실패: ' + err.message);
  }
}
  </script>
</body>
