<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MacroWatch 대쉬보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
      <div>
        <h1 class="text-2xl font-black tracking-tight text-white">MacroWatch 대쉬보드</h1>
        <p class="text-sm text-slate-400 mt-1">각종 경제지표를 주기적으로 추적 하여 알림을 줍니다.</p>
      </div>
      <div id="db-status" class="px-3 py-1.5 rounded-full text-xs font-semibold bg-yellow-950/60 text-yellow-400 border border-yellow-700/50 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></span>
        DB 연결 확인 중...
      </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-6">
<h2 class="text-lg font-bold text-white mb-4 flex items-center">
  <i class="fa-solid fa-plus-circle mr-2 text-blue-500"></i>
  새로운 추적 항목 추가
</h2>
      
      <form id="add-form" onsubmit="handleAddTarget(event)" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">수집 방식</label>
            <select id="input-type" onchange="toggleTypeFields()" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-200">
              <option value="SELECTOR">일반 웹 Scraping</option>
              <option value="FRED">FRED 경제지표</option>
              <option value="API">범용 API</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-medium text-slate-400 mb-1">항목 이름 (Title)</label>
            <input type="text" id="input-title" required placeholder="예: 미국 10년물 국채 금리" 
                   class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>

        <div id="field-selector" class="space-y-4">
          <input type="url" id="input-url" placeholder="웹사이트 URL (https://...)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm">
          <input type="text" id="input-selector" placeholder="CSS Selector (예: [data-testid='price'])" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm font-mono">
        </div>

        <div id="field-fred" class="hidden space-y-4">
          <input type="text" id="input-fred-id" placeholder="FRED Series ID (예: DGS10)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm font-mono">
        </div>

        <div id="field-api" class="hidden space-y-4">
          <input type="url" id="input-api-url" placeholder="API Endpoint URL" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm font-mono">
          <input type="text" id="input-json-path" placeholder="JSON Path (예: observations[0].value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm font-mono">
        </div>

        <div class="p-3 bg-slate-800/50 border border-slate-700/60 rounded-lg grid grid-cols-1 md:grid-cols-2 gap-3">
          <select id="input-condition" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
            <option value="changed">단순 값 변경 시</option>
            <option value="gte">목표값 상향 돌파</option>
            <option value="lte">목표값 하향 돌파</option>
          </select>
          <input type="text" id="input-target-val" placeholder="목표 기준값 (선택)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm">
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-lg transition">추적 항목 추가</button>
      </form>
    </div>

    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
     <h2 class="text-lg font-bold text-white mb-4 flex items-center">
        <i class="fa-solid fa-list-check mr-2 text-blue-500"></i>
        현재 추적 중인 항목 목록
      </h2>
      <div id="target-list" class="divide-y divide-slate-800">
        <p class="text-sm text-slate-500 py-4 text-center">불러오는 중...</p>
      </div>
    </div>
  </div>

  <script>
    // 🔑 본인의 Supabase 설정 정보 입력
    const SUPABASE_URL = "https://xhghpywvthjuvespzdul.supabase.co";
    const SUPABASE_KEY = "sb_publishable_rPKY5Wfpp1JnSkPhIzJqJA_cijBqYgc";
    const FRED_API_KEY = "12ce2a29eb8e65de769bb88cc9deb4b0";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 1. 입력 필드 토글 함수
    function toggleTypeFields() {
      const type = document.getElementById('input-type').value;
      document.getElementById('field-selector').classList.toggle('hidden', type !== 'SELECTOR');
      document.getElementById('field-fred').classList.toggle('hidden', type !== 'FRED');
      document.getElementById('field-api').classList.toggle('hidden', type !== 'API');
    }

    // 2. 페이지 로드 시 DB 연결 테스트 및 목록 조회
    window.addEventListener('DOMContentLoaded', async () => {
      const statusBadge = document.getElementById('db-status');
      try {
        const { error } = await supabaseClient.from('targets').select('*').limit(1);
        if (error) throw error;
        statusBadge.className = "px-3 py-1.5 rounded-full text-xs font-semibold bg-green-950/60 text-green-400 border border-green-700/50 flex items-center gap-2";
        statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-400"></span> DB 연결 성공`;
        fetchTargets();
      } catch (err) {
        statusBadge.className = "px-3 py-1.5 rounded-full text-xs font-semibold bg-red-950/60 text-red-400 border border-red-700/50 flex items-center gap-2";
        statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-400"></span> DB 연결 실패`;
      }
    });

    // 3. 데이터 등록 함수
    async function handleAddTarget(e) {
      e.preventDefault();
      const type = document.getElementById('input-type').value;
      const title = document.getElementById('input-title').value.trim();
      const condition_type = document.getElementById('input-condition').value;
      const target_value = document.getElementById('input-target-val').value.trim();

      let url = '', css_selector = '';

      if (type === 'FRED') {
        const seriesId = document.getElementById('input-fred-id').value.trim().toUpperCase();
        url = `https://api.stlouisfed.org/fred/series/observations?series_id=${seriesId}&api_key=${FRED_API_KEY}&file_type=json&sort_order=desc&limit=1`;
        css_selector = 'API:observations[0].value';
      } else if (type === 'API') {
        url = document.getElementById('input-api-url').value.trim();
        css_selector = `API:${document.getElementById('input-json-path').value.trim()}`;
      } else {
        url = document.getElementById('input-url').value.trim();
        css_selector = document.getElementById('input-selector').value.trim();
      }

      const { error } = await supabaseClient.from('targets').insert([{ title, url, css_selector, condition_type, target_value }]);
      if (error) return alert('등록 실패: ' + error.message);
      
      alert('성공적으로 등록되었습니다!');
      document.getElementById('add-form').reset();
      toggleTypeFields();
      fetchTargets();
    }

  

// 2. 화살표 이동 함수 (순서 꼬임 방지 및 안전장치 포함)
async function moveOrder(id, direction) {
  // 현재 전체 목록을 display_order 오름차순으로 가져옴
  const { data: allTargets, error } = await supabaseClient
    .from('targets')
    .select('id, display_order')
    .order('display_order', { ascending: true });

  if (error || !allTargets) return;

  // 만약 display_order가 전부 초기값(0) 등으로 겹쳐있다면 기본 인덱스 순서로 재정의 보정
  allTargets.forEach((t, idx) => {
    if (t.display_order === null || t.display_order === undefined) {
      t.display_order = idx;
    }
  });

  const currentIndex = allTargets.findIndex(t => t.id === id);
  if (currentIndex === -1) return;

  // 맨 위에서 위로 가거나, 맨 아래에서 아래로 가는 것 방지
  if (direction === 'up' && currentIndex === 0) return;
  if (direction === 'down' && currentIndex === allTargets.length - 1) return;

  const swapIndex = direction === 'up' ? currentIndex - 1 : currentIndex + 1;
  const currentItem = allTargets[currentIndex];
  const swapItem = allTargets[swapIndex];

  // 순서 번호(display_order) 서로 맞교환 (Swap)
  await Promise.all([
    supabaseClient.from('targets').update({ display_order: swapItem.display_order }).eq('id', currentItem.id),
    supabaseClient.from('targets').update({ display_order: currentItem.display_order }).eq('id', swapItem.id)
  ]);

  fetchTargets(); // 목록 새로고침
}
    
// 4. 리스트 목록 불러오기 및 렌더링 (아이콘 + 조건 수정 기능 포함)
async function fetchTargets() {
  const listContainer = document.getElementById('target-list');
  try {
    const { data, error } = await supabaseClient.from('targets').select('*').order('display_order', { ascending: true });
    if (error) throw error;

    if (!data || data.length === 0) {
      listContainer.innerHTML = `<p class="text-sm text-slate-500 py-4 text-center"><i class="fa-solid fa-circle-info mr-2"></i>등록된 추적 항목이 없습니다.</p>`;
      return;
    }

    // 조건 문구 및 아이콘 매핑
    const condConfig = {
      'changed': { label: '단순 값 변경 시', icon: 'fa-rotate' },
      'gte': { label: '목표값 상향 돌파', icon: 'fa-arrow-trend-up' },
      'lte': { label: '목표값 하향 돌파', icon: 'fa-arrow-trend-down' },
      'eq': { label: '목표값 일치 시', icon: 'fa-equals' }
    };

    listContainer.innerHTML = data.map((item) => {
      const config = condConfig[item.condition_type] || { label: item.condition_type, icon: 'fa-bell' };
      const targetValStr = item.target_value ? ` (${item.target_value})` : '';
      
      return `
        <div class="border-b border-slate-700/60 last:border-b-0">
          <div class="py-3 flex justify-between items-center" id="view-${item.id}">
            <div class="flex-1 cursor-pointer pr-4 group" onclick="toggleEdit(${item.id})">
              <div class="flex items-center">
                <i class="fa-solid fa-chart-line text-blue-500 mr-2 text-xs"></i>
                <span class="font-bold text-slate-200 group-hover:text-blue-400 transition">${item.title}</span>
              </div>
              <div class="text-xs text-slate-400 mt-0.5 ml-5 flex items-center">
                <i class="fa-solid ${config.icon} mr-1.5 text-[10px] text-blue-400"></i>
                감지 조건: <span class="text-slate-300 ml-1 font-medium">${config.label}${targetValStr}</span>
              </div>
            </div>
            
            <div class="flex items-center gap-3">
              <span class="text-xs text-slate-400">최근: <strong class="text-slate-200">${item.last_value || '대기 중'}</strong></span>
              <div class="flex items-center gap-0.5 bg-slate-900/80 border border-slate-700 rounded px-1 py-0.5">
                <button onclick="moveOrder(${item.id}, 'up'); event.stopPropagation();" class="px-1.5 py-0.5 text-xs text-slate-400 hover:text-white transition">▲</button>
                <span class="text-slate-600 text-xs">|</span>
                <button onclick="moveOrder(${item.id}, 'down'); event.stopPropagation();" class="px-1.5 py-0.5 text-xs text-slate-400 hover:text-white transition">▼</button>
              </div>
            </div>
          </div>

          <div id="edit-${item.id}" class="hidden py-3 bg-slate-900 px-3 rounded-lg my-2 border border-slate-700 space-y-2.5">
            <div>
              <label class="text-[10px] text-slate-400 block mb-1">항목 이름</label>
              <input type="text" id="val-title-${item.id}" value="${item.title}" class="w-full bg-slate-950 border border-slate-700 rounded p-1.5 text-xs text-white">
            </div>
            <div>
              <label class="text-[10px] text-slate-400 block mb-1">웹사이트 URL</label>
              <input type="text" id="val-url-${item.id}" value="${item.url}" class="w-full bg-slate-950 border border-slate-700 rounded p-1.5 text-xs text-slate-300">
            </div>
            <div>
              <label class="text-[10px] text-slate-400 block mb-1">CSS Selector</label>
              <input type="text" id="val-selector-${item.id}" value="${(item.css_selector || '').replace(/"/g, '&quot;')}" class="w-full bg-slate-950 border border-slate-700 rounded p-1.5 text-xs text-slate-300">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-[10px] text-slate-400 block mb-1">감지 조건</label>
                <select id="val-cond-${item.id}" class="w-full bg-slate-950 border border-slate-700 rounded p-1.5 text-xs text-slate-300">
                  <option value="changed" ${item.condition_type === 'changed' ? 'selected' : ''}>단순 값 변경</option>
                  <option value="gte" ${item.condition_type === 'gte' ? 'selected' : ''}>상향 돌파</option>
                  <option value="lte" ${item.condition_type === 'lte' ? 'selected' : ''}>하향 돌파</option>
                  <option value="eq" ${item.condition_type === 'eq' ? 'selected' : ''}>목표값 일치</option>
                </select>
              </div>
              <div>
                <label class="text-[10px] text-slate-400 block mb-1">목표값 (숫자)</label>
                <input type="text" id="val-target-${item.id}" value="${item.target_value || ''}" class="w-full bg-slate-950 border border-slate-700 rounded p-1.5 text-xs text-white" placeholder="예: 4.5">
              </div>
            </div>
            <div class="flex justify-end gap-2 pt-1">
              <button onclick="toggleEdit(${item.id})" class="text-xs px-2.5 py-1 bg-slate-800 text-slate-300 rounded">취소</button>
              <button onclick="saveEdit(${item.id})" class="text-xs px-2.5 py-1 bg-blue-600 hover:bg-blue-500 text-white rounded">저장</button>
            </div>
          </div>
        </div>
      `;
    }).join('');

  } catch (err) {
    listContainer.innerHTML = `<p class="text-sm text-red-400 py-4 text-center">목록을 불러오는 중 오류가 발생했습니다.</p>`;
  }
}


    // 수정 내용 저장 함수 (조건 및 목표값 포함)
async function saveEdit(id) {
  const title = document.getElementById(`val-title-${id}`).value;
  const url = document.getElementById(`val-url-${id}`).value;
  const css_selector = document.getElementById(`val-selector-${id}`).value;
  const condition_type = document.getElementById(`val-cond-${id}`).value;
  const target_value = document.getElementById(`val-target-${id}`).value;

  const { error } = await supabaseClient
    .from('targets')
    .update({ title, url, css_selector, condition_type, target_value: target_value ? parseFloat(target_value) : null })
    .eq('id', id);

  if (error) {
    alert('수정 실패: ' + error.message);
  } else {
    fetchTargets();
  }
}


    
    // 수정창 토글 (열기/닫기)
function toggleEdit(id) {
  document.getElementById(`view-${id}`).classList.toggle('hidden');
  document.getElementById(`edit-${id}`).classList.toggle('hidden');
}

// 수정 내용 DB에 저장
async function saveEdit(id) {
  const title = document.getElementById(`val-title-${id}`).value;
  const url = document.getElementById(`val-url-${id}`).value;
  const css_selector = document.getElementById(`val-selector-${id}`).value;

  await supabaseClient
    .from('targets')
    .update({ title, url, css_selector })
    .eq('id', id);

  fetchTargets(); // 새로고침하여 닫힌 상태로 복구
}
  </script>
</body>
</html>
