<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MacroWatch 대쉬보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FontAwesome 아이콘 사용을 위한 CDN 추가 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- 헤더 영역 -->
<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
  <div class="flex items-center gap-2">
    <div class="p-3 bg-blue-600/20 border border-blue-500/30 rounded-xl text-blue-400 text-xl shadow-lg shadow-blue-500/10">
      <i class="fa-solid fa-satellite-dish animate-pulse"></i>
    </div>
    <div>
      <h1 class="text-xl font-extrabold text-white tracking-tight">MacroWatch</h1>
      <p class="text-xs text-slate-400">맞춤형 경제지표 수치 변동 알리미</p>
    </div>
  </div>

  <div id="db-status" class="px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-800/80 text-slate-400 border border-slate-700/60 flex items-center gap-2 shadow-inner">
    <span class="w-2 h-2 rounded-full bg-slate-500 animate-pulse"></span> DB 연결 확인 중...
  </div>
</div>

    <!-- 새로운 추적 항목 추가 폼 -->
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-6">
      <h2 class="text-lg font-bold text-white mb-4 flex items-center">
        <i class="fa-solid fa-plus-circle mr-2 text-blue-500"></i>
        새로운 추적 항목 추가
      </h2>
      
      <form id="add-form" onsubmit="handleAddTarget(event)" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">수집 방식</label>
            <select id="input-type" onchange="toggleTypeFields()" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-200">
              <option value="SELECTOR">웹 스크래핑</option>
              <option value="FRED">FRED 경제지표</option>
              <option value="API">범용 API</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-medium text-slate-400 mb-1">항목 이름 (Title)</label>
            <input type="text" id="input-title" required placeholder="예: 미국 10년물 국채 금리" 
                   class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>

        <div id="field-selector" class="space-y-4">
          <input type="url" id="input-url" placeholder="웹사이트 URL (https://...)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm">
          <input type="text" id="input-selector" placeholder="CSS Selector (예: [data-testid='price'])" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm font-mono">
        </div>

        <div id="field-fred" class="hidden space-y-4">
          <input type="text" id="input-fred-id" placeholder="FRED Series ID (예: DGS10)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm font-mono">
        </div>

        <div id="field-api" class="hidden space-y-4">
          <input type="url" id="input-api-url" placeholder="API Endpoint URL" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm font-mono">
          <input type="text" id="input-json-path" placeholder="JSON Path (예: observations[0].value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm font-mono">
        </div>

        <div class="p-3 bg-slate-800/50 border border-slate-700/60 rounded-lg grid grid-cols-1 md:grid-cols-2 gap-3">
          <select id="input-condition" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
            <option value="changed">단순 값 변경 시</option>
            <option value="gte">목표값 상향 돌파</option>
            <option value="lte">목표값 하향 돌파</option>
            <option value="eq">목표값 일치 시</option>
          </select>
          <input type="text" id="input-target-val" placeholder="목표 기준값 (선택)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm">
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-lg transition">추적 항목 추가</button>
      </form>
    </div>

    <!-- 추적 항목 목록 영역 -->
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
     <h2 class="text-lg font-bold text-white mb-4 flex items-center">
        <i class="fa-solid fa-list-check mr-2 text-blue-500"></i>
        현재 추적 중인 항목 목록
      </h2>
      <div id="target-list" class="divide-y divide-slate-800">
        <p class="text-sm text-slate-500 py-4 text-center">불러오는 중...</p>
      </div>
    </div>
  </div>



  
<script>
    // 🔑 본인의 Supabase 설정 정보 입력
    const SUPABASE_URL = "https://xhghpywvthjuvespzdul.supabase.co";
    const SUPABASE_KEY = "sb_publishable_rPKY5Wfpp1JnSkPhIzJqJA_cijBqYgc";
    const FRED_API_KEY = "12ce2a29eb8e65de769bb88cc9deb4b0";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 1. 입력 필드 토글 함수
    function toggleTypeFields() {
      const type = document.getElementById('input-type').value;
      document.getElementById('field-selector').classList.toggle('hidden', type !== 'SELECTOR');
      document.getElementById('field-fred').classList.toggle('hidden', type !== 'FRED');
      document.getElementById('field-api').classList.toggle('hidden', type !== 'API');
    }

    // 2. 페이지 로드 시 DB 연결 테스트 및 목록 조회
    window.addEventListener('DOMContentLoaded', async () => {
      const statusBadge = document.getElementById('db-status');
      try {
        const { error } = await supabaseClient.from('targets').select('*').limit(1);
        if (error) throw error;
        statusBadge.className = "px-3 py-1.5 rounded-full text-xs font-semibold bg-green-950/60 text-green-400 border border-green-700/50 flex items-center gap-2";
        statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-400"></span> DB 연결 성공`;
        fetchTargets();
      } catch (err) {
        statusBadge.className = "px-3 py-1.5 rounded-full text-xs font-semibold bg-red-950/60 text-red-400 border border-red-700/50 flex items-center gap-2";
        statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-400"></span> DB 연결 실패`;
      }
    });

    // 3. 데이터 등록 함수
    async function handleAddTarget(e) {
      e.preventDefault();
      const type = document.getElementById('input-type').value;
      const title = document.getElementById('input-title').value.trim();
      const condition_type = document.getElementById('input-condition').value;
      const target_value_raw = document.getElementById('input-target-val').value.trim();
      const target_value = target_value_raw !== "" ? parseFloat(target_value_raw) : null;

      let url = '', css_selector = '';

      if (type === 'FRED') {
        const seriesId = document.getElementById('input-fred-id').value.trim().toUpperCase();
        url = `https://api.stlouisfed.org/fred/series/observations?series_id=${seriesId}&api_key=${FRED_API_KEY}&file_type=json&sort_order=desc&limit=1`;
        css_selector = 'API:observations[0].value';
      } else if (type === 'API') {
        url = document.getElementById('input-api-url').value.trim();
        css_selector = `API:${document.getElementById('input-json-path').value.trim()}`;
      } else {
        url = document.getElementById('input-url').value.trim();
        css_selector = document.getElementById('input-selector').value.trim();
      }

      const { count, error: countError } = await supabaseClient
        .from('targets')
        .select('*', { count: 'exact', head: true });

      const nextOrder = countError || count === null ? 0 : count;

      const { error } = await supabaseClient.from('targets').insert([{ 
        title, url, css_selector, condition_type, target_value, display_order: nextOrder 
      }]);

      if (error) return alert('등록 실패: ' + error.message);
      
      alert('성공적으로 등록되었습니다!');
      document.getElementById('add-form').reset();
      toggleTypeFields();
      fetchTargets();
    }

    // 4. 드래그 앤 드롭 관련 함수들
    let draggedItem = null;

    function handleDragStart(e) {
      // 수정창이 열려있는 상태라면 드래그를 강제로 막음
      const id = this.getAttribute('data-id');
      const editSection = document.getElementById(`edit-${id}`);
      if (editSection && !editSection.classList.contains('hidden')) {
        e.preventDefault();
        return;
      }

      draggedItem = this;
      this.classList.add('opacity-40', 'border-dashed', 'border-blue-500');
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      return false;
    }

    function handleDragEnter(e) {
      this.classList.add('bg-slate-800/80');
    }

    function handleDragLeave(e) {
      this.classList.remove('bg-slate-800/80');
    }

    function handleDrop(e) {
      e.stopPropagation();
      if (draggedItem !== this) {
        const listContainer = document.getElementById('target-list');
        const items = Array.from(listContainer.querySelectorAll('.draggable-item'));
        const draggedIdx = items.indexOf(draggedItem);
        const targetIdx = items.indexOf(this);

        if (draggedIdx < targetIdx) {
          listContainer.insertBefore(draggedItem, this.nextSibling);
        } else {
          listContainer.insertBefore(draggedItem, this);
        }
        
        saveNewOrder();
      }
      return false;
    }

    function handleDragEnd(e) {
      this.classList.remove('opacity-40', 'border-dashed', 'border-blue-500');
      document.querySelectorAll('.draggable-item').forEach(item => {
        item.classList.remove('bg-slate-800/80');
      });
    }

    async function saveNewOrder() {
      const listContainer = document.getElementById('target-list');
      const itemElements = listContainer.querySelectorAll('.draggable-item');
      
      const updatePromises = Array.from(itemElements).map((el, index) => {
        const id = parseInt(el.getAttribute('data-id'));
        return supabaseClient
          .from('targets')
          .update({ display_order: index })
          .eq('id', id);
      });

      await Promise.all(updatePromises);
    }
      
    // 5. 리스트 목록 불러오기 및 렌더링
    async function fetchTargets() {
      const listContainer = document.getElementById('target-list');
      try {
        const { data, error } = await supabaseClient.from('targets').select('*').order('display_order', { ascending: true });
        if (error) throw error;

        if (!data || data.length === 0) {
          listContainer.innerHTML = `<p class="text-sm text-slate-500 py-4 text-center"><i class="fa-solid fa-circle-info mr-2"></i>등록된 추적 항목이 없습니다.</p>`;
          return;
        }

        const condConfig = {
          'changed': { label: '단순 값 변경 시', icon: 'fa-rotate' },
          'gte': { label: '목표값 상향 돌파', icon: 'fa-arrow-trend-up' },
          'lte': { label: '목표값 하향 돌파', icon: 'fa-arrow-trend-down' },
          'eq': { label: '목표값 일치 시', icon: 'fa-equals' }
        };

        listContainer.innerHTML = data.map((item) => {
          const config = condConfig[item.condition_type] || { label: item.condition_type, icon: 'fa-bell' };
          const targetValStr = item.target_value !== null && item.target_value !== undefined ? ` (${item.target_value})` : '';
          const safeSelector = (item.css_selector || '').replace(/"/g, '&quot;');
          
          // FRED API 주소인 경우 실제 웹사이트 차트 보기 링크로 변환
          let displayUrl = item.url;
          if (item.url && item.url.includes('stlouisfed.org/fred/series/observations')) {
            const match = item.url.match(/series_id=([^&]+)/);
            if (match && match[1]) {
              displayUrl = `https://fred.stlouisfed.org/series/${match[1]}`;
            }
          }

          return `
            <div class="draggable-item border-b border-slate-700/60 last:border-b-0 py-3 transition-all rounded-lg px-2 cursor-grab active:cursor-grabbing" 
                 draggable="true" 
                 data-id="${item.id}">
              <div class="flex justify-between items-center" onclick="toggleEdit(${item.id})">
                <div class="flex-1 pr-4 group">
                  <div class="flex items-center">
                    <i class="fa-solid fa-grip-vertical text-slate-600 mr-2.5 text-xs hover:text-slate-400" title="마우스로 끌어서 순서 변경"></i>
                    <!-- <i class="fa-solid fa-chart-line text-blue-500 mr-2 text-sm"></i> -->
                    <span class="font-bold text-slate-200 group-hover:text-blue-400 transition mr-2">${item.title}</span>
                    
                    <a href="${displayUrl}" target="_blank" onclick="event.stopPropagation()" class="text-xs text-slate-500 hover:text-blue-400 bg-slate-800/80 hover:bg-slate-800 px-2 py-0.5 rounded border border-slate-700 transition" title="원본 페이지로 이동">
                      <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i> 원본
                    </a>
                  </div>
                  <div class="text-xs text-slate-400 mt-1 ml-9 flex items-center">
                    <i class="fa-solid ${config.icon} mr-1.5 text-[10px] text-blue-400"></i>
                    감지 조건: <span class="text-slate-300 ml-1 font-medium">${config.label}${targetValStr}</span>
                  </div>
                </div>
                
                <div class="flex items-center gap-3">
                  <span class="text-xs text-slate-400">최근: <strong class="text-slate-200">${item.last_value || '대기 중'}</strong></span>
                </div>
              </div>

              <div id="edit-${item.id}" class="hidden mt-3 pt-3 bg-slate-900/90 p-4 rounded-lg border border-slate-700 space-y-3 cursor-default" onclick="event.stopPropagation()">
                <div>
                  <label class="text-[11px] text-slate-400 block mb-1 font-medium">항목 이름 수정</label>
                  <input type="text" id="val-title-${item.id}" value="${item.title}" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs text-white">
                </div>
                <div>
                  <label class="text-[11px] text-slate-400 block mb-1 font-medium">웹사이트 URL</label>
                  <input type="text" id="val-url-${item.id}" value="${item.url}" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs text-slate-300">
                </div>
                <div>
                  <label class="text-[11px] text-slate-400 block mb-1 font-medium">CSS Selector (따옴표 유지)</label>
                  <input type="text" id="val-selector-${item.id}" value="${safeSelector}" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs text-slate-300">
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label class="text-[11px] text-slate-400 block mb-1 font-medium">감지 조건</label>
                    <select id="val-cond-${item.id}" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs text-slate-300">
                      <option value="changed" ${item.condition_type === 'changed' ? 'selected' : ''}>단순 값 변경</option>
                      <option value="gte" ${item.condition_type === 'gte' ? 'selected' : ''}>상향 돌파</option>
                      <option value="lte" ${item.condition_type === 'lte' ? 'selected' : ''}>하향 돌파</option>
                      <option value="eq" ${item.condition_type === 'eq' ? 'selected' : ''}>목표값 일치</option>
                    </select>
                  </div>
                  <div>
                    <label class="text-[11px] text-slate-400 block mb-1 font-medium">목표값</label>
                    <input type="text" id="val-target-${item.id}" value="${item.target_value !== null && item.target_value !== undefined ? item.target_value : ''}" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs text-white" placeholder="예: 4.8">
                  </div>
                </div>
                <div class="flex justify-end gap-2 pt-1">
                  <button onclick="toggleEdit(${item.id})" class="text-xs px-3 py-1.5 bg-slate-800 text-slate-300 rounded hover:bg-slate-700 transition">취소</button>
                  <button onclick="saveEdit(${item.id})" class="text-xs px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded font-medium transition">저장하기</button>
                </div>
              </div>
            </div>
          `;
        }).join('');

        const draggables = listContainer.querySelectorAll('.draggable-item');
        draggables.forEach(item => {
          item.addEventListener('dragstart', handleDragStart);
          item.addEventListener('dragover', handleDragOver);
          item.addEventListener('dragenter', handleDragEnter);
          item.addEventListener('dragleave', handleDragLeave);
          item.addEventListener('drop', handleDrop);
          item.addEventListener('dragend', handleDragEnd);
        });

      } catch (err) {
        listContainer.innerHTML = `<p class="text-sm text-red-400 py-4 text-center">목록을 불러오는 중 오류가 발생했습니다.</p>`;
      }
    }

    // 6. 수정창 열고 닫을 때 드래그 잠금/해제 제어
    function toggleEdit(id) {
      const editSection = document.getElementById(`edit-${id}`);
      if (!editSection) return;
      
      const itemCard = editSection.closest('.draggable-item');
      const isHidden = editSection.classList.contains('hidden');
      
      editSection.classList.toggle('hidden');

      if (isHidden) {
        // 수정창이 열릴 때: 드래그 잠금 (글자 선택 및 입력 편의성 확보)
        itemCard.setAttribute('draggable', 'false');
        itemCard.classList.remove('cursor-grab', 'active:cursor-grabbing');
      } else {
        // 수정창이 닫힐 때: 드래그 복구
        itemCard.setAttribute('draggable', 'true');
        itemCard.classList.add('cursor-grab', 'active:cursor-grabbing');
      }
    }

    // 7. 수정 내용 DB 저장 함수
    async function saveEdit(id) {
      const title = document.getElementById(`val-title-${id}`).value;
      const url = document.getElementById(`val-url-${id}`).value;
      const css_selector = document.getElementById(`val-selector-${id}`).value;
      const condition_type = document.getElementById(`val-cond-${id}`).value;
      const target_value_raw = document.getElementById(`val-target-${id}`).value;
      const target_value = target_value_raw !== "" ? parseFloat(target_value_raw) : null;

      const { data: currentItem, error: fetchError } = await supabaseClient
        .from('targets')
        .select('display_order')
        .eq('id', id)
        .single();

      if (fetchError) {
        alert('기존 순서 정보를 가져오지 못했습니다.');
        return;
      }

      const { error } = await supabaseClient
        .from('targets')
        .update({ 
          title: title, 
          url: url, 
          css_selector: css_selector, 
          condition_type: condition_type, 
          target_value: target_value,
          display_order: currentItem.display_order ?? 0 
        })
        .eq('id', id);

      if (error) {
        alert('수정 실패: ' + error.message);
      } else {
        toggleEdit(id); 
        fetchTargets(); 
      }
    }
  </script>
</body>
</html>
